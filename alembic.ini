# Alembic config (Phase 3, 082)
# NOTE: keep this file ASCII-only. alembic reads it with encoding="locale",
# which is GBK on zh-CN Windows and raises UnicodeDecodeError on non-ASCII bytes.
# The DB URL is not hardcoded here: migrations/env.py overrides it via
# backend.auth.database.resolve_database_url() (i.e. the DATABASE_URL env var).
[alembic]
script_location = migrations
prepend_sys_path = .

# Placeholder only; overridden at runtime by env.py from DATABASE_URL
sqlalchemy.url = sqlite:///backend/data/lupin.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
