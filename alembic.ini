# Alembic 配置（Phase 3，082）
# 数据库地址不写死在这里：migrations/env.py 会用 backend.auth.database
# 的 resolve_database_url()（即 DATABASE_URL 环境变量）覆盖。
[alembic]
script_location = migrations
prepend_sys_path = .

# 默认地址仅作占位，实际运行时被 env.py 的 DATABASE_URL 覆盖
sqlalchemy.url = sqlite:///backend/data/lupin.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
