name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 运行 pytest（跳过需真实模型的用例）
        env:
          # O-12：tests/conftest.py fail-fast 护栏要求测试库不得指向
          # 业务库；CI 上显式给 scratch 库（runner.temp 每次运行全新）。
          DATABASE_URL: "sqlite:///${{ runner.temp }}/lupin_ci.db"
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_retry_drill.py \
            --ignore=tests/test_export.py \
            --ignore=tests/test_regression.py \
            --ignore=tests/test_risk.py \
            2>&1 | tee pytest-report.txt

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.txt

  frontend-check:
    name: 前端 JS 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node --check 全部 JS
        run: |
          fail=0
          for f in $(find frontend/js -name '*.js'); do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail

  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pip-audit 依赖漏洞扫描
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc || echo "::warning::pip-audit 发现漏洞，见上方输出"

      - name: gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    steps:
      - uses: actions/checkout@v4

      - name: 构建生产镜像
        run: docker build -f Dockerfile.prod -t lupin-kaipai:${{ github.sha }} .
